<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>PaceMates Karte</title>
<!--
  Vorlage für Launch-Grafiken. Gerendert mit marketing/render.cjs.
  Parameter in der Adresse: ?w=1080&h=1350&v=post-1
  Keine Zahlen, keine Kurven, keine Personen: nur Aussagen, die die Software hält.
-->
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-style: italic; src: url("../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-italic.woff2") format("woff2"); }
  @font-face { font-family: "Outfit"; font-weight: 400; src: url("../../node_modules/@fontsource/outfit/files/outfit-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Outfit"; font-weight: 600; src: url("../../node_modules/@fontsource/outfit/files/outfit-latin-600-normal.woff2") format("woff2"); }
  :root { --chalk: #f3f0e8; --asphalt: #15171a; --tartan: #b0361a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body { font-family: Outfit, sans-serif; background: var(--chalk); color: var(--asphalt); position: relative; }
  .frame { position: absolute; inset: 0; padding: calc(var(--u) * 7); display: flex; flex-direction: column; justify-content: space-between; }
  .dark { background: var(--asphalt); color: var(--chalk); }
  .red { background: var(--tartan); color: #fff; }
  .mark { display: flex; align-items: center; gap: calc(var(--u) * 1.6); font-family: "Barlow Condensed"; font-style: italic; font-weight: 700; font-size: calc(var(--u) * 5); }
  .mark svg { width: calc(var(--u) * 7); color: var(--tartan); }
  .red .mark svg, .dark .mark svg { color: currentColor; }
  .kicker { text-transform: uppercase; letter-spacing: 0.16em; font-weight: 600; font-size: calc(var(--u) * 2.4); color: var(--tartan); margin-bottom: calc(var(--u) * 3); }
  .red .kicker { color: #fff; opacity: 0.85; }
  .dark .kicker { color: #ff7a4d; }
  h1 { font-family: "Barlow Condensed"; font-weight: 700; text-transform: uppercase; line-height: 0.92; font-size: calc(var(--u) * var(--size, 13)); letter-spacing: -0.005em; }
  p.sub { font-size: calc(var(--u) * 3.1); line-height: 1.35; margin-top: calc(var(--u) * 3.5); max-width: 32ch; opacity: 0.9; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font-size: calc(var(--u) * 2.5); gap: 20px; }
  .lanes { position: absolute; right: 0; top: 0; bottom: 0; width: 34%; pointer-events: none; }
  .lanes rect { fill: none; stroke: currentColor; stroke-width: 3; opacity: 0.18; }
  .red .lanes rect { opacity: 0.4; }
  ul { list-style: none; padding: 0; margin-top: calc(var(--u) * 4); display: grid; gap: calc(var(--u) * 1.6); font-size: calc(var(--u) * 3); }
  li::before { content: ""; display: inline-block; width: calc(var(--u) * 2.4); height: 4px; background: var(--tartan); vertical-align: middle; margin-right: calc(var(--u) * 1.6); }
  .dark li::before { background: #ff7a4d; }
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
  const q = new URLSearchParams(location.search);
  const w = Number(q.get('w') || 1200), h = Number(q.get('h') || 630);
  document.documentElement.style.setProperty('--w', w + 'px');
  document.documentElement.style.setProperty('--h', h + 'px');
  document.documentElement.style.setProperty('--u', Math.min(w, h) / 100 * (h / w > 1.5 ? 1.35 : 1) + 'px');
  const mark = '<div class="mark"><svg viewBox="0 0 48 32"><rect x="2" y="3" width="44" height="26" rx="13" fill="none" stroke="currentColor" stroke-width="3"/><rect x="9" y="10" width="30" height="12" rx="6" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.55"/><path d="M30 3v7" stroke="currentColor" stroke-width="3"/></svg>PaceMates</div>';
  const lanes = '<svg class="lanes" viewBox="0 0 300 600" preserveAspectRatio="xMaxYMid slice">' + [0, 34, 68, 102].map(d => `<rect x="${40 + d}" y="${-200 + d}" width="${600 - 2 * d}" height="${1000 - 2 * d}" rx="${260 - d}"/>`).join('') + '</svg>';
  const variants = {
    og: { cls: '', kicker: 'Ausdauer, aus deinen Daten', title: 'Sieh, was dein Training wirklich tut.', size: 11, sub: 'Umfang, Intensität, Form und Erholung aus deinen eigenen Garmin- und Strava-Daten.' },
    'post-1': { cls: '', kicker: 'Neu: PaceMates', title: 'Sieh, was dein Training wirklich tut.', size: 14, sub: 'Für Laufen, Rad, Schwimmen und Triathlon. Aus deinen eigenen Garmin- und Strava-Daten.' },
    'post-2': { cls: 'dark', kicker: 'Ein Grundsatz', title: 'Ohne deine Daten bleibt alles leer.', size: 14, sub: 'Keine Beispielkurven. Keine erfundenen Werte. PaceMates rechnet nur mit dem, was du importierst.' },
    'post-3': { cls: 'red', kicker: 'Keine Blackbox', title: 'Jeder Tipp zeigt seine Zahl.', size: 14, sub: 'Feste Regeln auf deinen Werten: Belastung der letzten 7 Tage, Form, Monotonie. Du siehst, was den Hinweis auslöst.' },
    'post-4': { cls: '', kicker: 'Privat', title: 'Deine Einheiten bleiben auf deinem Gerät.', size: 12, list: ['Kein Konto', 'Dateien werden im Browser gelesen', 'Keine Cookies, kein Tracking'] },
    story: { cls: 'dark', kicker: 'Neu: PaceMates', title: 'Viele Zahlen. Wenig Antworten?', size: 12, list: ['Umfang und Intensität', 'Trends und Vergleiche', 'Form und Erholung', 'Tipps mit Begründung'] },
  };
  const v = variants[q.get('v') || 'og'];
  document.body.className = v.cls;
  document.documentElement.style.setProperty('--size', v.size);
  document.getElementById('frame').innerHTML = lanes +
    `<div>${mark}</div>` +
    `<div style="position:relative"><p class="kicker">${v.kicker}</p><h1>${v.title}</h1>` +
    (v.sub ? `<p class="sub">${v.sub}</p>` : '') +
    (v.list ? `<ul>${v.list.map(i => `<li>${i}</li>`).join('')}</ul>` : '') + '</div>' +
    `<div class="foot"><span>Kein Konto · Keine Beispieldaten</span><strong>pacemates.de</strong></div>`;
</script>
</body>
</html>
