<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaceMates · Ausdauer, aus deinen Daten</title>
    <meta
      name="description"
      content="PaceMates zeigt Umfang, Intensität, Verlauf, Form und Erholung aus deinen eigenen Lauf-, Rad- und Schwimmeinheiten aus Garmin und Strava. Kein Konto, keine Beispieldaten, die Daten bleiben im Browser."
    />
    <meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="PaceMates" />
    <meta property="og:title" content="PaceMates · Sieh, was dein Training wirklich tut." />
    <meta property="og:description" content="Umfang, Intensität, Form und Erholung aus deinen eigenen Garmin- und Strava-Daten. Kein Konto, keine Beispieldaten." />
    <meta property="og:image" content="%PACEMATES_OG_IMAGE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        var theme = localStorage.getItem('pacemates.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (error) {
        /* Darstellung fällt auf das System zurück. */
      }
    </script>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var redirect = params.get('p');
          if (!redirect || !/^\/(?!\/)/.test(redirect)) return;
          if (redirect.indexOf('://') !== -1 || redirect.indexOf('\\') !== -1) return;
          window.history.replaceState(null, '', redirect);
        } catch (error) {
          /* Ohne Verlaufs-Wiederherstellung bleibt die Startseite. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>PaceMates braucht JavaScript. Import und Auswertung laufen in deinem Browser, nicht auf einem Server.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
